<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusTube - Stats & Shame Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="dashboard-container">
    <header class="header">
      <div class="header-content">
        <img src="../icons/icon48.png" alt="FocusTube Logo" class="logo">
        <h1>Focus Dashboard</h1>
      </div>
      <p class="subtitle">Track your productivity, ads skipped, and how many times you quit early...</p>
    </header>

    <main class="stats-grid">
      <!-- Positive Stats -->
      <div class="stat-card positive">
        <div class="stat-icon">
          <svg style="width:40px;height:40px;color:#38bdf8;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path></svg>
        </div>
        <div class="stat-value" id="val-shorts">0</div>
        <div class="stat-label">Shorts Skipped</div>
      </div>
      
      <div class="stat-card positive">
        <div class="stat-icon">
          <svg style="width:40px;height:40px;color:#10b981;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
        </div>
        <div class="stat-value" id="val-ads">0</div>
        <div class="stat-label">Ads Blocked</div>
      </div>
      
      <div class="stat-card positive">
        <div class="stat-icon">
          <svg style="width:40px;height:40px;color:#fcd34d;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
        </div>
        <div class="stat-value" id="val-summaries">0</div>
        <div class="stat-label">AI Summaries Generated</div>
      </div>
    </main>
    
    <div class="shame-section">
      <h2 class="shame-title">The "Wall of Shame"</h2>
      <div class="stat-card shame">
        <div class="stat-icon">
          <svg style="width:40px;height:40px;color:#ef4444;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        </div>
        <div class="stat-value shame-text" id="val-quits">0</div>
        <div class="stat-label">Times You Quit Focus Early</div>
        <p class="shame-subtext" id="shame-msg">Keep pushing through the hard questions next time!</p>
      </div>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
