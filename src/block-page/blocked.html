<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Blocked — FocusTube</title>
  <link rel="stylesheet" href="../shared/liquid-glass.css" />
  <style>
    body { margin: 0; min-height: 100vh; }
  </style>
</head>
<body class="lg-surface">
  <div class="lg-aurora"></div>
  <div class="lg-block-overlay" style="position: relative; z-index: 1;">
    <div class="lg-block-card">
      <div class="lg-block-icon" id="block-icon">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h1 class="lg-block-title" id="block-title">Site Blocked</h1>
      <p class="lg-block-reason" id="block-reason">This site is blocked by FocusTube.</p>
      <div class="lg-block-timer" id="block-timer" style="display: none;"></div>
      <p class="lg-block-message" id="block-message">
        Stay focused — this site is blocked to help you maintain productivity.
      </p>
      <div class="lg-block-actions">
        <button class="lg-btn lg-btn-ghost" onclick="history.back()">← Go Back</button>
        <a class="lg-btn lg-btn-primary" href="https://www.youtube.com">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Home
        </a>
      </div>
    </div>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
